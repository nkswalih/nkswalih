<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="400" viewBox="0 0 1500 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="55%" style="stop-color:#d6eeff"/>
      <stop offset="100%" style="stop-color:#b8d8f5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1500" height="400" fill="url(#bgGrad)"/>

  <!-- Top-left label -->
  <text x="50" y="55" font-family="Courier New, Courier, monospace" font-size="18" fill="#444444">↘ Let's Connect</text>

  <!-- Decorative asterisk top-right (large) -->
  <g transform="translate(1390,230)">
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#b0cfe0" stroke-width="3" stroke-linecap="round"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#b0cfe0" stroke-width="3" stroke-linecap="round"/>
    <line x1="-21" y1="-21" x2="21" y2="21" stroke="#b0cfe0" stroke-width="3" stroke-linecap="round"/>
    <line x1="21" y1="-21" x2="-21" y2="21" stroke="#b0cfe0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Decorative asterisk small -->
  <g transform="translate(1340,160)">
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#b0cfe0" stroke-width="2" stroke-linecap="round"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#b0cfe0" stroke-width="2" stroke-linecap="round"/>
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#b0cfe0" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#b0cfe0" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Small blue asterisk near headline -->
  <g transform="translate(868,150)">
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-6" y1="-6" x2="6" y2="6" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="6" y1="-6" x2="-6" y2="6" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Headline line 1 -->
  <text x="750" y="160" font-family="Courier New, Courier, monospace" font-size="70" font-weight="bold" fill="#111111" text-anchor="middle" letter-spacing="2">FIRST, SOLVE THE PROBLEM</text>

  <!-- Headline line 2 -->
  <text x="750" y="242" font-family="Courier New, Courier, monospace" font-size="70" font-weight="bold" fill="#111111" text-anchor="middle" letter-spacing="2">THEN, WRITE THE CODE.</text>

  <!-- Python pill -->
  <rect x="510" y="305" width="150" height="40" rx="20" fill="none" stroke="#999" stroke-width="1.5"/>
  <circle cx="537" cy="325" r="11" fill="#3776AB"/>
  <text x="537" y="329" font-family="Courier New, Courier, monospace" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Py</text>
  <text x="600" y="330" font-family="Courier New, Courier, monospace" font-size="15" fill="#222" text-anchor="middle">python</text>

  <!-- React pill -->
  <rect x="678" y="305" width="155" height="40" rx="20" fill="none" stroke="#999" stroke-width="1.5"/>
  <circle cx="705" cy="325" r="11" fill="#20232a"/>
  <text x="705" y="330" font-family="Courier New, Courier, monospace" font-size="13" fill="#61DAFB" text-anchor="middle" font-weight="bold">R</text>
  <text x="770" y="330" font-family="Courier New, Courier, monospace" font-size="15" fill="#222" text-anchor="middle">react.js</text>

  <!-- JavaScript pill -->
  <rect x="851" y="305" width="175" height="40" rx="20" fill="none" stroke="#999" stroke-width="1.5"/>
  <rect x="868" y="313" width="22" height="22" rx="3" fill="#F7DF1E"/>
  <text x="879" y="329" font-family="Courier New, Courier, monospace" font-size="11" fill="#222" text-anchor="middle" font-weight="bold">JS</text>
  <text x="960" y="330" font-family="Courier New, Courier, monospace" font-size="15" fill="#222" text-anchor="middle">javascript</text>

</svg>
